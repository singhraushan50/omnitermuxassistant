name: Build hybrid Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  llama-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
      - name: Install Android NDK
        uses: android-actions/setup-android@v4
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
      - name: Fetch llama.cpp LFM3-Omni support PR
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git fetch origin pull/31257/head:lfm3-omni
          git checkout lfm3-omni
      - name: Build Android arm64 llama-server
        run: |
          sdkmanager "ndk;27.2.12479018"
          export ANDROID_NDK="${ANDROID_HOME}/ndk/27.2.12479018"
          cmake -S llama.cpp -B llama.cpp/build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build llama.cpp/build-android --target llama-server --config Release --parallel 2
          mkdir -p runtime/bin
          cp llama.cpp/build-android/bin/llama-server runtime/bin/
          cp llama.cpp/LICENSE runtime/
          printf 'Built from ggml-org/llama.cpp PR #31257 for Android arm64-v8a.\n' > runtime/BUILD_INFO.txt
          (cd runtime && zip -9 -r ../llama-runtime.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: llama-runtime
          path: llama-runtime.zip
          if-no-files-found: error
          retention-days: 7

  apk:
    needs: llama-runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: llama-runtime
          path: app/src/main/assets
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OmniTermuxAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
